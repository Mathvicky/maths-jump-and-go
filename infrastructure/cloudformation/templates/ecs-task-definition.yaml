AWSTemplateFormatVersion: "2010-09-09"

Description: ECS Task Definition

Parameters:
  BackendImageUri:
    Type: String
    Description: ECR image URI with a unique immutable release tag.
  ApplicationTaskRoleArn:
    Type: String
    Description: ApplicationTaskRoleArn from the application task role stack.
  ServiceBasePostcode:
    Type: String
    NoEcho: true
  GoogleLeadsWebhookUrl:
    Type: String
    NoEcho: true
    Description: Deployed Google Apps Script web app URL.
  GoogleLeadsWebhookSecret:
    Type: String
    NoEcho: true
    Description: Shared secret configured in Apps Script properties.
  AllowedOrigins:
    Type: String
    Default: '["https://mathsjumpandgo.co.uk"]'
  NightRateStartHour:
    Type: Number
    Default: 22
    MinValue: 0
    MaxValue: 23
  NightRateEndHour:
    Type: Number
    Default: 7
    MinValue: 0
    MaxValue: 23
  Vehicle12vAdjustment:
    Type: Number
    Default: 0
    MinValue: 0
  Vehicle24vAdjustment:
    Type: Number
    Default: 30
    MinValue: 0

Resources:

  BackendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: maths-jump-and-go-backend

      RequiresCompatibilities:
        - FARGATE

      NetworkMode: awsvpc

      Cpu: "256"
      Memory: "512"

      ExecutionRoleArn: "arn:aws:iam::653058737468:role/maths-jump-and-go-ecs-execution-role"

      TaskRoleArn: !Ref ApplicationTaskRoleArn

      ContainerDefinitions:
        - Name: backend

          Image: !Ref BackendImageUri
          Environment:
            - Name: SERVICE_BASE_POSTCODE
              Value: !Ref ServiceBasePostcode
            - Name: GOOGLE_LEADS_WEBHOOK_URL
              Value: !Ref GoogleLeadsWebhookUrl
            - Name: GOOGLE_LEADS_WEBHOOK_SECRET
              Value: !Ref GoogleLeadsWebhookSecret
            - Name: ALLOWED_ORIGINS
              Value: !Ref AllowedOrigins
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: NIGHT_RATE_START_HOUR
              Value: !Ref NightRateStartHour
            - Name: NIGHT_RATE_END_HOUR
              Value: !Ref NightRateEndHour
            - Name: VEHICLE_12V_ADJUSTMENT
              Value: !Ref Vehicle12vAdjustment
            - Name: VEHICLE_24V_ADJUSTMENT
              Value: !Ref Vehicle24vAdjustment

          Essential: true

          PortMappings:
            - ContainerPort: 8001

          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/maths-jump-and-go-development
              awslogs-region: eu-west-2
              awslogs-stream-prefix: backend

Outputs:
  TaskDefinitionArn:
    Value: !Ref BackendTaskDefinition
