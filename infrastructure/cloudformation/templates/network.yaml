AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Network foundation for the Math's Jump & Go platform.
  Creates a VPC with public and private subnets across two
  Availability Zones. NAT Gateways are intentionally excluded
  from this foundation template.

Parameters:
  ProjectName:
    Type: String
    Default: maths-jump-and-go
    AllowedPattern: "^[a-z0-9-]+$"
    Description: Lowercase project identifier used in resource tags.

  EnvironmentName:
    Type: String
    Default: development
    AllowedValues:
      - development
      - staging
      - production
    Description: Deployment environment name.

  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
    AllowedPattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$"
    Description: IPv4 CIDR block for the VPC.

  PublicSubnetOneCidr:
    Type: String
    Default: 10.20.0.0/24
    AllowedPattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$"
    Description: IPv4 CIDR block for public subnet one.

  PublicSubnetTwoCidr:
    Type: String
    Default: 10.20.1.0/24
    AllowedPattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$"
    Description: IPv4 CIDR block for public subnet two.

  PrivateSubnetOneCidr:
    Type: String
    Default: 10.20.10.0/24
    AllowedPattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$"
    Description: IPv4 CIDR block for private subnet one.

  PrivateSubnetTwoCidr:
    Type: String
    Default: 10.20.11.0/24
    AllowedPattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$"
    Description: IPv4 CIDR block for private subnet two.

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      InstanceTenancy: default
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-vpc"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-igw"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref Vpc

  PublicSubnetOne:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select
        - 0
        - !GetAZs ""
      CidrBlock: !Ref PublicSubnetOneCidr
      MapPublicIpOnLaunch: true
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-public-az1"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: NetworkTier
          Value: public
        - Key: kubernetes.io/role/elb
          Value: "1"

  PublicSubnetTwo:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select
        - 1
        - !GetAZs ""
      CidrBlock: !Ref PublicSubnetTwoCidr
      MapPublicIpOnLaunch: true
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-public-az2"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: NetworkTier
          Value: public
        - Key: kubernetes.io/role/elb
          Value: "1"

  PrivateSubnetOne:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select
        - 0
        - !GetAZs ""
      CidrBlock: !Ref PrivateSubnetOneCidr
      MapPublicIpOnLaunch: false
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-private-az1"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: NetworkTier
          Value: private
        - Key: kubernetes.io/role/internal-elb
          Value: "1"

  PrivateSubnetTwo:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select
        - 1
        - !GetAZs ""
      CidrBlock: !Ref PrivateSubnetTwoCidr
      MapPublicIpOnLaunch: false
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-private-az2"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: NetworkTier
          Value: private
        - Key: kubernetes.io/role/internal-elb
          Value: "1"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-public-routes"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetOneRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetOne

  PublicSubnetTwoRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetTwo

  PrivateRouteTableOne:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-private-routes-az1"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  PrivateRouteTableTwo:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-private-routes-az2"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  PrivateSubnetOneRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTableOne
      SubnetId: !Ref PrivateSubnetOne

  PrivateSubnetTwoRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTableTwo
      SubnetId: !Ref PrivateSubnetTwo

Outputs:
  VpcId:
    Description: ID of the platform VPC.
    Value: !Ref Vpc
    Export:
      Name: !Sub "${ProjectName}-${EnvironmentName}-vpc-id"

  VpcCidr:
    Description: CIDR block assigned to the platform VPC.
    Value: !GetAtt Vpc.CidrBlock

  PublicSubnetIds:
    Description: Comma-separated public subnet IDs.
    Value: !Join
      - ","
      - - !Ref PublicSubnetOne
        - !Ref PublicSubnetTwo
    Export:
      Name: !Sub "${ProjectName}-${EnvironmentName}-public-subnet-ids"

  PrivateSubnetIds:
    Description: Comma-separated private subnet IDs.
    Value: !Join
      - ","
      - - !Ref PrivateSubnetOne
        - !Ref PrivateSubnetTwo
    Export:
      Name: !Sub "${ProjectName}-${EnvironmentName}-private-subnet-ids"

  PublicSubnetOneId:
    Description: ID of public subnet one.
    Value: !Ref PublicSubnetOne

  PublicSubnetTwoId:
    Description: ID of public subnet two.
    Value: !Ref PublicSubnetTwo

  PrivateSubnetOneId:
    Description: ID of private subnet one.
    Value: !Ref PrivateSubnetOne

  PrivateSubnetTwoId:
    Description: ID of private subnet two.
    Value: !Ref PrivateSubnetTwo

  PublicRouteTableId:
    Description: ID of the public route table.
    Value: !Ref PublicRouteTable

  PrivateRouteTableOneId:
    Description: ID of private route table one.
    Value: !Ref PrivateRouteTableOne

  PrivateRouteTableTwoId:
    Description: ID of private route table two.
    Value: !Ref PrivateRouteTableTwo
