AWSTemplateFormatVersion: "2010-09-09"
Description: Runtime permissions for postcode route estimation.
Parameters:
  TaskRoleName:
    Type: String
    Default: maths-jump-and-go-application-task
Resources:
  ApplicationTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref TaskRoleName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RouteEstimates
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: geo-routes:CalculateRouteMatrix
                Resource: "*"
Outputs:
  ApplicationTaskRoleArn:
    Value: !GetAtt ApplicationTaskRole.Arn
