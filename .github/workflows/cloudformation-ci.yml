name: CloudFormation CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
    paths:
      - "infrastructure/cloudformation/**"
      - ".github/workflows/cloudformation-ci.yml"

  pull_request:
    branches:
      - main
      - develop
    paths:
      - "infrastructure/cloudformation/**"
      - ".github/workflows/cloudformation-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-cloudformation:
    name: Validate CloudFormation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infrastructure/cloudformation/requirements.txt

      - name: Install infrastructure validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r infrastructure/cloudformation/requirements.txt

      - name: Validate CloudFormation templates
        env:
          AWS_REGION: eu-west-2
        run: ./infrastructure/cloudformation/scripts/validate.sh
